name: Kurser

on:
  schedule:
    # Sedan 2026-11-21 bara en kvällsstart som reserv: workflowen Morgon hämtar kurserna 06.10 varje vardag,
    # och den dagliga körningen startar en hämtning via trigger/kurser.txt om filen ändå är gammal.
    - cron: "40 21 * * 1-5"   # 22.40 svensk vintertid: efter stängning i Stockholm och USA
  workflow_dispatch:
  push:
    paths:
      - "symboler.json"
      - "hamta.py"
      - ".github/workflows/kurser.yml"
      # Den dagliga körningen skriver hit när kursfilen är gammal, så att en hämtning startar direkt.
      - "trigger/kurser.txt"

permissions:
  contents: write

concurrency:
  group: kurser
  cancel-in-progress: false

jobs:
  hamta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # senaste main när jobbet startar, inte committen som startade det
      - name: Hämta kurser
        run: python3 -u hamta.py
      - name: Spara kurser.json
        run: |
          git config user.name "kurser-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kurser.json
          git diff --cached --quiet && exit 0
          git commit -m "Kurser $(date -u +%Y-%m-%dT%H:%MZ)"
          # Två körningar efter varandra ändrar samma fil: behåll den nyss hämtade (-X theirs är den egna committen vid rebase).
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; git rebase --abort 2>/dev/null; sleep 5; done
          exit 1
