name: Kurser

on:
  schedule:
    - cron: "40 21 * * 1-5"   # 22.40 svensk vintertid: efter stängning i Stockholm och USA
    - cron: "10 4 * * 2-6"    # 05.10 svensk vintertid: reserv före den dagliga körningen 06.39
  workflow_dispatch:
  push:
    paths:
      - "symboler.json"
      - "hamta.py"
      - ".github/workflows/kurser.yml"

permissions:
  contents: write

concurrency:
  group: kurser
  cancel-in-progress: false

jobs:
  hamta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Testa källor
        continue-on-error: true
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          for u in \
            "https://query1.finance.yahoo.com/v8/finance/chart/NVDA?range=5d&interval=1d" \
            "https://query2.finance.yahoo.com/v8/finance/chart/INVE-B.ST?range=5d&interval=1d" \
            "https://stooq.com/q/d/l/?s=nvda.us&i=d" \
            "https://www.google.com/finance/quote/INVE-B:STO" \
            "https://www.avanza.se/_api/price-chart/stock/5247?timePeriod=one_week"; do
            echo "== $u"
            curl -sS -m 10 -A "$UA" -o /tmp/svar -w "status %{http_code} tid %{time_total}s\n" "$u" || echo "curl-fel"
            head -c 300 /tmp/svar | tr -d '\n'; echo
          done
      - name: Hämta kurser
        run: python3 -u hamta.py
      - name: Spara kurser.json
        run: |
          git config user.name "kurser-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kurser.json
          git diff --cached --quiet && exit 0
          git commit -m "Kurser $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
