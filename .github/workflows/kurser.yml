name: Kurser

on:
  schedule:
    # GitHub startar schemalagda körningar ibland flera timmar sent eller hoppar över dem, därför flera försök.
    - cron: "40 21 * * 1-5"   # 22.40 svensk vintertid: efter stängning i Stockholm och USA
    - cron: "20 23 * * 1-5"   # 00.20
    - cron: "35 1 * * 2-6"    # 02.35
    - cron: "5 3 * * 2-6"     # 04.05
    - cron: "55 3 * * 2-6"    # 04.55, sista försöket före den dagliga körningen 06.39
  workflow_dispatch:
  push:
    paths:
      - "symboler.json"
      - "hamta.py"
      - ".github/workflows/kurser.yml"
      # Den dagliga körningen skriver hit när kursfilen är gammal, så att en hämtning startar direkt.
      - "trigger/kurser.txt"

permissions:
  contents: write

concurrency:
  group: kurser
  cancel-in-progress: false

jobs:
  hamta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Hämta kurser
        run: python3 -u hamta.py
      - name: Spara kurser.json
        run: |
          git config user.name "kurser-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kurser.json
          git diff --cached --quiet && exit 0
          git commit -m "Kurser $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
