name: Sallning

on:
  schedule:
    # En gång i månaden, den 1:a. GitHub startar ibland sent eller hoppar över, därför ett andra försök den 2:a.
    - cron: "17 5 1 * *"   # 06.17 svensk vintertid
    - cron: "17 5 2 * *"   # reserv: körs bara om den 1:a misslyckades (se jobbet koll)
  workflow_dispatch:
  push:
    paths:
      - "sallning.py"
      - ".github/workflows/sallning.yml"

permissions:
  contents: write

concurrency:
  group: sallning
  cancel-in-progress: false

jobs:
  koll:
    runs-on: ubuntu-latest
    outputs:
      kor: ${{ steps.koll.outputs.kor }}
    steps:
      - uses: actions/checkout@v4
      - name: Behövs körningen
        id: koll
        run: |
          # Reservkörningen den 2:a hoppas över om månadens sållning redan finns och gick bra.
          if [ "${{ github.event.schedule }}" = "17 5 2 * *" ] && [ -f "arkiv/sallning-$(date -u +%Y-%m).json" ] \
             && grep -q '"status": "ok"' sallning.json; then
            echo "kor=nej" >> "$GITHUB_OUTPUT"
          else
            echo "kor=ja" >> "$GITHUB_OUTPUT"
          fi

  # En marknad per jobb: jobben körs samtidigt från olika maskiner, så att Yahoo inte stryper anropen
  # och en marknad som strular inte stoppar de andra.
  marknad:
    needs: koll
    if: needs.koll.outputs.kor == 'ja'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        marknad: [se, "no", dk, fi, us-stora, us-mellan]
    steps:
      - uses: actions/checkout@v4
      - name: Sålla ${{ matrix.marknad }}
        run: python3 -u sallning.py --marknad ${{ matrix.marknad }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: del-${{ matrix.marknad }}
          path: delar/${{ matrix.marknad }}.json
          if-no-files-found: ignore
          retention-days: 7

  ihop:
    needs: [koll, marknad]
    if: always() && needs.koll.outputs.kor == 'ja'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: del-*
          path: delar
          merge-multiple: true
      - name: Slå ihop marknaderna
        run: python3 -u sallning.py --sla-ihop
      - name: Spara sallning.json
        run: |
          git config user.name "kurser-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sallning.json
          if [ -d arkiv ]; then git add arkiv; fi
          git diff --cached --quiet && exit 0
          git commit -m "Sållning $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
