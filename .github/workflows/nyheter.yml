name: Nyheter

on:
  schedule:
    # Före den dagliga aktiebevakningen 06.39 svensk tid. GitHub startar ibland sent, därför flera försök.
    - cron: "20 3 * * 1-5"   # 04.20 svensk vintertid
    - cron: "5 4 * * 1-5"    # 05.05
    - cron: "50 4 * * 1-5"   # 05.50
    # Efter stängning i USA, så att kvällens rapporter finns i filen även om morgonkörningarna startar sent (4–5 nov startade de 7–8 timmar sent).
    - cron: "35 22 * * 1-5"  # 23.35
  workflow_dispatch:
  push:
    paths:
      - "nyhetsbolag.json"
      - "nyheter.py"
      - ".github/workflows/nyheter.yml"
      # Den dagliga körningen skriver hit när nyhetsfilen är gammal, så att en hämtning startar direkt i stället för att vänta på GitHubs schema.
      - "trigger/nyheter.txt"

permissions:
  contents: write

concurrency:
  group: nyheter
  cancel-in-progress: false

jobs:
  hamta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # senaste main när jobbet startar, inte committen som startade det
      - name: Hämta nyheter
        run: python3 -u nyheter.py
      - name: Spara nyheter.json
        run: |
          git config user.name "kurser-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nyheter.json
          git diff --cached --quiet && exit 0
          git commit -m "Nyheter $(date -u +%Y-%m-%dT%H:%MZ)"
          # Två körningar efter varandra ändrar samma fil: behåll den nyss hämtade (-X theirs är den egna committen vid rebase).
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; git rebase --abort 2>/dev/null; sleep 5; done
          exit 1
