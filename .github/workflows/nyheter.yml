name: Nyheter

on:
  schedule:
    # Före den dagliga aktiebevakningen 06.39 svensk tid. GitHub startar ibland sent, därför flera försök.
    - cron: "20 3 * * 1-5"   # 04.20 svensk vintertid
    - cron: "5 4 * * 1-5"    # 05.05
    - cron: "50 4 * * 1-5"   # 05.50
  workflow_dispatch:
  push:
    paths:
      - "nyhetsbolag.json"
      - "nyheter.py"
      - ".github/workflows/nyheter.yml"

permissions:
  contents: write

concurrency:
  group: nyheter
  cancel-in-progress: false

jobs:
  hamta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Hämta nyheter
        run: python3 -u nyheter.py
      - name: Spara nyheter.json
        run: |
          git config user.name "kurser-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nyheter.json
          if [ -f mfn_debug.json ]; then git add mfn_debug.json; fi
          git diff --cached --quiet && exit 0
          git commit -m "Nyheter $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
