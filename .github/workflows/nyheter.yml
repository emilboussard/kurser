name: Nyheter

on:
  schedule:
    # Sedan 2026-11-21 bara en kvällsstart som reserv: workflowen Morgon hämtar nyheterna 06.10 varje vardag,
    # och den dagliga körningen startar en hämtning via trigger/nyheter.txt om filen ändå är gammal.
    - cron: "35 22 * * 1-5"  # 23.35 svensk vintertid, efter stängning i USA
  workflow_dispatch:
  push:
    paths:
      - "nyhetsbolag.json"
      - "nyheter.py"
      - ".github/workflows/nyheter.yml"
      # Den dagliga körningen skriver hit när nyhetsfilen är gammal, så att en hämtning startar direkt i stället för att vänta på GitHubs schema.
      - "trigger/nyheter.txt"

permissions:
  contents: write

concurrency:
  group: nyheter
  cancel-in-progress: false

jobs:
  hamta:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # avkodningen av Google-länkar tar några minuter extra
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # senaste main när jobbet startar, inte committen som startade det
      - name: Hämta nyheter
        run: python3 -u nyheter.py
      - name: Spara nyheter.json
        run: |
          git config user.name "kurser-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nyheter.json
          git diff --cached --quiet && exit 0
          git commit -m "Nyheter $(date -u +%Y-%m-%dT%H:%MZ)"
          # Två körningar efter varandra ändrar samma fil: behåll den nyss hämtade (-X theirs är den egna committen vid rebase).
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; git rebase --abort 2>/dev/null; sleep 5; done
          exit 1
